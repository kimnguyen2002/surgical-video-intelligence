<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surgical Video Intelligence</title>
    <meta name="description" content="Robotic surgical video understanding that runs entirely in the browser. Instrument detection, presence and task recognition on the SurgVU 2024 release — no server, no API key, nothing uploaded." />
    <meta property="og:title" content="Surgical Video Intelligence" />
    <meta property="og:description" content="Robotic surgical video understanding that runs entirely in the browser. Instrument detection, presence and task recognition on the SurgVU 2024 release — no server, no API key, nothing uploaded." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('svi-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-surface', /^#\/console/.test(location.hash) ? 'console' : 'home');
      })();
    </script>
  </head>
  <body class="bg-page text-fg overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
